name: CI

# Until this file existed the repository had NO GitHub Actions workflows at all,
# so every pull request's only checks were Vercel's deployment ones — a PR could
# go red on types or tests and still show an all-green check list.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR branch supersedes the older run. `main` is
# deliberately excluded: every commit that lands keeps its own result, so a
# bisect later has a real signal per commit rather than "cancelled".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + tests
    # Pinned rather than ubuntu-latest, which migrates to Ubuntu 26 on
    # 2026-10-19: a runner image that changes under us turns an unrelated push
    # into the thing that broke CI. Bump deliberately, with its own run to prove it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # pnpm MUST be installed before setup-node: setup-node's `cache: pnpm`
      # shells out to `pnpm store path` to find what to cache, so without the
      # binary already present that step fails.
      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile makes a package.json/pnpm-lock.yaml mismatch a failure
      # rather than silently resolving something different from local installs.
      # The lockfile already carries the linux-x64 native packages (sharp,
      # esbuild), so nothing has to compile here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --max-warnings 0 on purpose. The repo reached zero errors AND zero
      # warnings, and a warning nobody fails on is how the count climbed to 149
      # errors unnoticed in the first place. If a rule turns out to be wrong for
      # this codebase, change the rule in eslint.config.mjs deliberately rather
      # than letting its warnings pile up here.
      - name: Lint
        run: pnpm exec eslint --max-warnings 0

      - name: Typecheck
        if: '!cancelled()'
        run: pnpm exec tsc --noEmit

      # `!cancelled()` so the suite still runs when the typecheck fails: one red
      # run then reports both problems instead of hiding the tests behind types.
      # The tests need no services or secrets — they run Postgres in-process via
      # pglite — so there is nothing to provision.
      - name: Tests
        if: '!cancelled()'
        run: pnpm test
