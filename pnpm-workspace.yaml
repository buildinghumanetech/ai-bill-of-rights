# Security overrides (pnpm 11 reads `overrides` here, not from package.json):
#  - js-cookie <3.0.6: cookie-attribute injection (GHSA-qjx8-664m-686j), via Clerk
#  - postcss <8.5.10: XSS in CSS stringify (GHSA-qx2v-qp2m-jg93), via Next
overrides:
  js-cookie@<3.0.6: '>=3.0.6'
  postcss@<8.5.10: '>=8.5.10'
allowBuilds:
  '@clerk/shared': set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
